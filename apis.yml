aid: pollinate
name: Pollinate
description: >-
  Pollinate is a London-headquartered financial technology company that builds a
  cloud-based, bank-grade digital experience platform helping banks and payment
  processors reinvent merchant acquiring and value-added services for their small
  and medium business (SMB) customers. The platform wraps around a bank's legacy
  payment systems to deliver dynamic merchant onboarding, a bank-branded Merchant
  Command Center dashboard (transaction reconciliation, dispute management,
  statements, service discovery), integrated merchant services inside online
  banking, and ISV enablement. Built on Microsoft Azure and open-banking ready, it
  powers live bank deployments including Tyl by NatWest (UK), NAB Hive (Australia),
  and Tyl by CIBC (Canada), with clients including Truist and partners including
  Fiserv, Endava, and Dun & Bradstreet. Pollinate's APIs are private and
  partner-facing; it does not publish a public developer portal or OpenAPI.
